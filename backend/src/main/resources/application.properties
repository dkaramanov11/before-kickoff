spring.application.name=before-kickoff

spring.datasource.url=jdbc:postgresql://localhost:5433/before_kickoff
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

football-data.base-url=https://api.football-data.org/v4
football-data.api-token=${FOOTBALL_DATA_API_TOKEN}